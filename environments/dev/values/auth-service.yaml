# auth-service dev environment values
# Chart source: mock-trading-platform-app/charts/auth-service
#
# Secret contract:
# - auth-jwt/JWT_SECRET는 ExternalSecret으로 생성된 Kubernetes Secret에서 공급

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/mock-trading-platform/auth-service
  tag: "sha-a03d8a6"
  pullPolicy: IfNotPresent

fullnameOverride: auth-service

service:
  type: ClusterIP

# JWT_SECRET 은 ExternalSecret(auth-jwt)이 생성한 K8s Secret 에서 envFrom 으로 공급한다.
# 차트의 빈값 skip 가드 덕에 literal JWT_SECRET 은 제거해도 됨(envFrom 값이 그대로 적용).
# DEV_MODE 등 나머지 env 는 차트 기본값(DEV_MODE=true: 데모 dev/dev 로그인) 사용.
envFrom:
  - secretRef:
      name: auth-jwt
