apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mock-trading-platform-dev-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: mock-trading-platform-dev

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.20.4"
    helm:
      values: |
        # chart 권장값: CRD를 함께 설치해 operator + CRD 순서를 단순화
        installCRDs: true
        replicaCount: 1
        # ESO ServiceAccount(external-secrets/external-secrets)에 IRSA role ARN 부여.
        # mock-trading-platform-infra envs/dev/iam.tf 의 trust policy가 이 SA
        # (system:serviceaccount:external-secrets:external-secrets)만 assume 허용하므로,
        # 이 어노테이션으로 web identity 토큰을 받아야 ClusterSecretStore 가 SM 인증에 성공한다.
        #
        # name 을 반드시 고정한다: 비워두면 차트가 SA 이름을 fullname(=Helm release 이름)
        # 기반으로 생성하는데, ArgoCD 는 Application 이름(mock-trading-platform-dev-external-secrets)을
        # release 이름으로 렌더하므로 SA 가 mock-trading-platform-dev-external-secrets 로 만들어져
        # trust policy/ClusterSecretStore 가 기대하는 external-secrets 와 불일치하게 된다.
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/mock-trading-platform-dev-external-secrets-role

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Helm이 커다란 CRD를 번들로 딥어 client-side apply를 쓰면
      # kubectl.kubernetes.io/last-applied-configuration annotation이
      # 262144 bytes를 초과해 sync 실패. SSA로 전환하면 annotation
      # 미사용이라 해결됨.
      - ServerSideApply=true
