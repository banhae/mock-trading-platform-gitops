apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mock-trading-platform-dev-secret-contract
  namespace: argocd
  # App 삭제 시 ExternalSecret/생성 Secret 을 cascade prune 하여 고아 리소스를 방지한다.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # external-secrets operator/CRD 동기화 이후 contract 적용
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: mock-trading-platform-dev

  source:
    repoURL: https://github.com/banhae/mock-trading-platform-gitops.git
    targetRevision: main
    path: argocd/manifests/dev/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: mock-trading-platform-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ESO CRD(ClusterSecretStore/ExternalSecret)는 wave-1 external-secrets App 이 설치한다.
    # 신규/재생성 클러스터에서 CRD 가 아직 없을 때 이 wave-2 App 이 먼저 sync 되면
    # "no matches for kind" 로 실패하는데, auto-sync 는 동일 SHA 의 실패를 자동 재시도하지
    # 않는다. retry backoff 로 CRD 설치 완료 후 자동 수렴하게 하고,
    # SkipDryRunOnMissingResource 로 CRD 부재 시 dry-run 단계 실패를 회피한다.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
