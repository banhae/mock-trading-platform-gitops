# ClusterSecretStore(cluster-scoped)를 쓴다. namespaced SecretStore 였다면
# serviceAccountRef.namespace 가 무시되어 store 와 같은 네임스페이스(mock-trading-platform-dev)에서
# SA 를 찾는데, ESO SA 는 external-secrets 네임스페이스에 있고 IRSA trust policy 도
# external-secrets:external-secrets 만 허용하므로 인증이 실패한다. ClusterSecretStore
# 에서만 serviceAccountRef.namespace 로 cross-namespace SA 참조가 유효하다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mock-trading-platform-dev-aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # role 필드는 두지 않는다. serviceAccountRef 로 지정한 SA 의
      # eks.amazonaws.com/role-arn 어노테이션(external-secrets App helm values 에서 부여,
      # mock-trading-platform-infra envs/dev/iam.tf 의 mock-trading-platform-dev-external-secrets-role)을 ESO 가 읽어
      # AssumeRoleWithWebIdentity 로 단 한 번 assume 한다. 여기에 provider.aws.role 까지
      # 두면 그 role 을 추가로 sts:AssumeRole(self-assume) 하는데, trust policy 는 web
      # identity assume 만 허용하므로 실패한다(SecretSyncedError).
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
