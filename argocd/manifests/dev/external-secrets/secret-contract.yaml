# 범위: auth-jwt 만. app-db/app-nats 는 후속(별건) — IRSA policy(mock-trading-platform/dev/auth-jwt-??????)도
# auth-jwt 만 허용하므로, 추가 시 Secrets Manager 시크릿 + IRSA resources 확장이 선행돼야 한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-jwt
  namespace: mock-trading-platform-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mock-trading-platform-dev-aws-secretsmanager
  target:
    name: auth-jwt
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: mock-trading-platform/dev/auth-jwt
        property: JWT_SECRET
